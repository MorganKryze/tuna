version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  # The default set — errcheck, govet, ineffassign, staticcheck, unused — plus
  # the ones below. Every addition here earned its place by finding something:
  # revive found ten exported identifiers with no doc comment and three
  # shadowing a builtin, exhaustive found a switch that ignored a Key, gosec
  # found a state directory at 0755, errorlint a type assertion that would
  # miss a wrapped error.
  #
  # misspell is back. It was dropped when every string this binary printed was
  # French and it flagged "conflit" as a typo for "conflict"; the interface has
  # been English since v0.1.1, and an ignore list is no longer the price.
  enable:
    - revive
    - misspell
    - errorlint
    - exhaustive
    - gosec
    - unconvert
    - usestdlibvars
    - nolintlint # a //nolint without a reason is a finding somebody buried

  settings:
    errcheck:
      # Restoring the terminal on the way out and writing the escape codes
      # that draw the picker: there is nothing useful to do when either
      # fails, because the failure means the terminal is already gone.
      # strings.Builder.Write is documented never to fail.
      exclude-functions:
        - golang.org/x/term.Restore
        - (*os.File).Write
        - fmt.Fprint
        - fmt.Fprintln
        - (*strings.Builder).Write
        - io.WriteString
        - fmt.Fprintf

  exclusions:
    rules:
      # gosec reads a test suite as an attack: the whole point of this one is
      # to build a binary, write a fake ssh and run it. Its findings there are
      # the test doing its job, and eight //nolint lines would say less than
      # this rule does.
      - path: _test\.go
        linters: [gosec]
