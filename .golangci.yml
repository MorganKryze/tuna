version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  # The default set: errcheck, govet, ineffassign, staticcheck, unused.
  #
  # misspell was here and is gone. It reads English, and every string this
  # binary prints is French: it flagged "ressemble" as a typo for "resemble"
  # and "conflit" for "conflict", and caught nothing real in between. An
  # ignore list would have grown with the interface, one entry per French
  # word that happens to look like an English typo.
  settings:
    errcheck:
      # Restoring the terminal on the way out and writing the escape codes
      # that draw the picker: there is nothing useful to do when either
      # fails, because the failure means the terminal is already gone.
      # strings.Builder.Write is documented never to fail.
      exclude-functions:
        - golang.org/x/term.Restore
        - (*os.File).Write
        - fmt.Fprint
        - fmt.Fprintln
        - (*strings.Builder).Write
        - io.WriteString
        - fmt.Fprintf
