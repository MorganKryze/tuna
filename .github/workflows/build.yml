name: build

on:
  push:
    branches: [main]
  # No `paths` filter: these are required checks, and a required check that
  # never runs leaves a docs-only pull request waiting forever.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  test:
    # The ssh runner and the terminal drawing are Unix-only; the rest is
    # portable. Both systems run because the reconnection loop is the kind of
    # code that breaks on a difference in WaitStatus.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # publishes the badges to the orphan `badges` branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: measure and gate
        run: |
          # One run, two numbers. -json is what makes the count possible, so
          # the human output is rebuilt from the same file when it fails:
          # otherwise a red build shows a wall of JSON and nothing readable.
          if ! go test -race -covermode=atomic -coverpkg=./... \
            -coverprofile=cov.out -json ./... > tests.json; then
            jq -r 'select(.Action == "output") | .Output' tests.json | tail -60
            exit 1
          fi
          # Subtests included, since a table case that can fail on its own is
          # a test. Deduplicated by package and name: a package tested twice
          # in one run would otherwise count twice.
          count=$(jq -r 'select(.Action == "pass" and .Test != null)
            | "\(.Package)\t\(.Test)"' tests.json | sort -u | wc -l | tr -d ' ')
          pct=$(go tool cover -func=cov.out | awk '/^total:/ {sub(/%/,"",$NF); print $NF}')
          echo "coverage: ${pct}%, ${count} tests"
          echo "PCT=$pct" >> "$GITHUB_ENV"
          echo "TESTS=$count" >> "$GITHUB_ENV"
          # A floor set from today's measurement, with a few points of slack.
          # The total says less than the breakdown: ui and port are at 100%,
          # config and tunnel at 97%, recent at 94%. What sits below is
          # cmd/tunny, which is wiring, and pick/term.go, the drawing that no
          # test can exercise without a TTY. Neither will ever be covered.
          #
          # Raise it whenever the real measurement allows. A floor under
          # reality protects nothing; a floor above it blocks everyone and
          # proves nothing.
          awk -v p="$pct" 'BEGIN { exit (p + 0 >= 65) ? 0 : 1 }' \
            || { echo "::error::coverage ${pct}% is under the 65% floor"; exit 1; }

      # One system publishes, or the two take turns overwriting each other on
      # the same branch. ubuntu, because it is the one that counts the most
      # tests: the ssh runner has Unix-only ones.
      - name: publish badges
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/badges.sh "$PCT" "$TESTS"
