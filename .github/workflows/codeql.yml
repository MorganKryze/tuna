# CodeQL, lancé depuis le dépôt plutôt que depuis la configuration par défaut
# de GitHub.
#
# La configuration par défaut n'analyse pas une pull request venue d'un fork.
# Rien n'échoue quand ça arrive : aucune analyse n'est mise en file, donc les
# vérifications Analyze que la règle exige ne remontent jamais, et la pull
# request reste bloquée avec tout le reste au vert et aucun moyen d'obtenir
# ce qui manque.
#
# Un workflow dans le dépôt, lui, tourne pour un fork, avec un jeton en lecture
# seule et sans secret — c'est tout ce dont l'analyse a besoin.
name: codeql

on:
  push:
    branches: [main]
  # Pas de filtre `paths`, délibérément : ce sont des vérifications requises,
  # et une vérification requise qui ne tourne jamais laisse une pull request
  # de documentation en attente pour toujours. security.yml porte la même note
  # pour la même raison.
  pull_request:
    branches: [main]
  # Une exécution hebdomadaire est ce qui rattrape une requête qui apprend
  # quelque chose sur du code que personne n'a touché depuis.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # Nommé explicitement plutôt que laissé à GitHub, qui baptise un job de
    # matrice d'après chacune de ses clés : le mode de build s'inviterait dans
    # le nom et les vérifications sortiraient en « Analyze (go, autobuild) ».
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # init lit l'exécution à laquelle il appartient ; analyze publie ses
      # résultats.
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
