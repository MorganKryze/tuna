# CodeQL, run from the repository rather than from GitHub's default setup.
#
# Default setup does not analyse a pull request raised from a fork. Nothing
# fails when that happens: no analysis is queued at all, so the Analyze checks
# the ruleset requires never report, and the pull request sits blocked with
# every other check green and no way to get the missing ones.
#
# A workflow in the repository does run for a fork, with a read-only token and
# no secrets, which is all the analysis needs.
name: codeql

on:
  push:
    branches: [main]
  # No `paths` filter, deliberately: these are required checks, and a required
  # check that never runs leaves a docs-only pull request waiting forever.
  # security.yml carries the same note for the same reason.
  pull_request:
    branches: [main]
  # A weekly run is what catches a query that learns about code nobody has
  # touched since.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # Spelled out rather than left to GitHub, which names a matrix job after
    # every key in the entry: the build mode would ride along and the checks
    # would come out as "Analyze (go, autobuild)".
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # init reads the run it belongs to; analyze uploads the results.
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
