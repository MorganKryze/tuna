name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the binaries on the Release
      id-token: write # signs the provenance attestation, keylessly
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      # Cross-compilation rather than goreleaser: four binaries with no C
      # dependency are not worth one more action to pin and to follow.
      - name: build
        run: |
          set -eu
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%%/*}"; arch="${target##*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/tunny-${os}-${arch}" ./cmd/tunny
          done
          cd dist && sha256sum tunny-* > SHA256SUMS

      # Says which workflow, at which commit, produced these exact bytes.
      # Verify with: gh attestation verify tunny-… --repo MorganKryze/tunny
      #
      # Before the upload, not after. An attestation is keyed by the file's
      # own digest and lives in GitHub's attestation store, not on the release,
      # so it can be made while the binaries are still local files. Attaching
      # first would mean a failure here left downloadable binaries that
      # `gh attestation verify` answers "no attestation" for, which reads as
      # tampering rather than as a broken workflow.
      #
      # SHA256SUMS is a subject too: it is published next to the binaries and
      # people trust it the same way, so it needs the same proof.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tunny-*
            dist/SHA256SUMS

      # Upload to an existing release rather than create one: the notes are
      # written by hand from .github/RELEASE_TEMPLATE.md, and it is
      # `gh release create` with those notes that lays the tag and starts this
      # workflow. The fallback covers a tag pushed on its own, where generated
      # notes beat no binaries at all.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi

  # Bumps the formula in the tap so `brew upgrade` sees a new version without
  # anyone editing a file. Separate job: a failure here must not cast doubt on
  # binaries that are already published and attested.
  #
  # Needs TAP_TOKEN, a fine-grained PAT with Contents: read and write on
  # MorganKryze/homebrew-tap. github.token cannot reach another repository.
  # Without the secret the job is skipped rather than failed, so the release
  # still succeeds on a fork or before the token exists.
  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    # Stable tags only. This used to read `!github.event.release.prerelease`,
    # which never once did anything: the trigger above is a tag push, and a
    # push payload has no `release` key, so the expression was `!null` — true
    # for every tag there is. A `v0.4.0-rc1` would have gone straight into the
    # tap and `brew upgrade` would have handed it to everybody.
    #
    # The tag name is the thing this job actually has, so it is the thing to
    # ask. Semver puts a prerelease after a hyphen and nowhere else, and build
    # metadata after a plus, which is still a release.
    if: ${{ !contains(github.ref_name, '-') }}
    # At job level so the step's own `if` can see it: a step cannot read the
    # env block it declares itself.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: render the formula for this tag
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          # The checksum comes from the tarball GitHub serves, not from one we
          # rebuild: it is the file Homebrew will actually download.
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "rendering $version, sha256 $sha"
          sed -E \
            -e "s|^  url \".*\"|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            packaging/homebrew/tunny.rb > /tmp/tunny.rb
          ruby -c /tmp/tunny.rb
          # A formula whose url and sha did not both change is a formula that
          # would install the previous release under the new name.
          grep -q "$sha" /tmp/tunny.rb && grep -q "$GITHUB_REF_NAME.tar.gz" /tmp/tunny.rb
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: push it to the tap
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -eu
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          cp /tmp/tunny.rb tap/Formula/tunny.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already at $VERSION"
            exit 0
          fi
          git commit -qam "tunny $VERSION"
          git push
