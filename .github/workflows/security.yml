name: security

on:
  # The trigger that matters: it is what reports a CVE in a dependency
  # without waiting for the next commit.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
  # No `paths` filter here either: this job is a required check, and a
  # required check that never runs leaves a docs-only pull request waiting
  # forever.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
