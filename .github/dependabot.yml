version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # Actions are pinned to a SHA, which is exactly what nothing else watches:
  # a pinned action never updates itself and never warns that it is stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action/init and codeql-action/analyze are two entries of one
      # action, and it refuses to run with the two halves at different
      # versions: "Loaded a configuration file for version X, but running
      # version Y". Ungrouped, dependabot opens two pull requests that can
      # only pass together, so both are red until somebody merges them by
      # hand in the right order.
      codeql:
        patterns:
          - github/codeql-action/*
