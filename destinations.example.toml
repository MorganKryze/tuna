# Copier vers ~/.config/tuna/destinations.toml et adapter.
# Une destination = un tunnel SSH, autant de `forward` que d'UIs à joindre.

[[destination]]
name = "hyperviseur"
desc = "Cockpit + orchestrateur"
# Un alias de ~/.ssh/config suffit : il porte déjà le port, l'utilisateur
# et la clé. Les champs port et jump ci-dessous ne servent qu'aux cas que
# l'alias ne couvre pas.
host = "mon-hote"
forward = [
  { local = 9090, to = "127.0.0.1:9090", label = "Cockpit" },
  { local = 9120, to = "10.0.0.5:9120", label = "Komodo" },
]

[[destination]]
name = "vm-backup"
desc = "Duplicati d'une VM, joignable seulement depuis l'hôte"
host = "debian@10.0.0.5"
port = 22022 # si l'alias ssh ne le porte pas déjà
jump = "mon-hote" # devient -J : on passe par l'hôte pour atteindre la VM
forward = [{ local = 8201, to = "127.0.0.1:8200", label = "Duplicati" }]
