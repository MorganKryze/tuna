# Copy to ~/.config/tunny/destinations.toml and edit.
# One destination is one SSH tunnel, with as many `forward` entries as there
# are UIs behind it.

[[destination]]
name = "hypervisor"
desc = "Cockpit and the orchestrator"
# An alias from ~/.ssh/config is usually enough: it already carries the port,
# the user and the key. The port and jump fields below are only for what the
# alias does not cover.
host = "my-host"
forward = [
  { local = 9090, to = "127.0.0.1:9090", label = "Cockpit" },
  { local = 9120, to = "10.0.0.5:9120", label = "Komodo" },
]

[[destination]]
name = "vm-backup"
desc = "Duplicati on a VM, reachable only from its host"
host = "debian@10.0.0.5"
port = 22022 # when the ssh alias does not already carry it
jump = "my-host" # becomes -J: reach the VM through its host
forward = [{ local = 8201, to = "127.0.0.1:8200", label = "Duplicati" }]
